[workspace]
resolver = "2"
members = [
    "crates/lokey",
    "crates/lokey-macros",
    "crates/lokey-odyn",
    "crates/lokey-usb",
    "crates/lokey-usb-macros",
    "crates/lokey-ble",
    "crates/lokey-ble-macros",
    "crates/lokey-usb-ble",
    "crates/lokey-nrf",
    "crates/lokey-rp",
    "crates/lokey-keyboard",
    "crates/lokey-keyboard-macros",
    "crates/lokey-keyboard-odyn",
    "crates/lokey-mouse",
    "crates/lokey-midi",
    "crates/lokey-layer",
    "crates/lokey-led-array",
    "crates/lokey-led-array-odyn",
]
exclude = [
    "examples/lokey-blink",
    "examples/keyboard-nrf52840",
    "examples/keyboard-rp2040"
]

[profile.release]
debug = 2
