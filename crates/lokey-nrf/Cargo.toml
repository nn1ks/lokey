[package]
name = "lokey-nrf"
version = "0.0.0"
edition = "2024"
authors = ["Niklas Sauter <niklas@n1ks.net>"]
repository = "https://github.com/nn1ks/lokey"
license = "Apache-2.0 OR MIT"
description = "nRF microcontroller support for the lokey framework"
readme = "../../README.md"
categories = ["embedded", "no-std"]
keywords = ["firmware"]
rust-version = "1.96"

[features]
default = ["nrf52840"]

## Enables logging via [defmt](https://docs.rs/defmt/latest/defmt).
defmt = [
  "dep:defmt",
  "embassy-executor/defmt",
  "embassy-nrf/defmt",
  "embassy-sync?/defmt",
  "embassy-usb?/defmt",
  "lokey/defmt",
  "lokey-ble?/defmt",
  "lokey-usb?/defmt",
  "nrf-mpsl?/defmt",
  "nrf-sdc?/defmt",
  "trouble-host?/defmt",
]

## Enables support for USB.
usb = [
  "dep:embassy-usb",
  "dep:lokey-usb",
]

## Enables support for Bluetooth Low Energy (BLE).
ble = [
  "dep:embassy-sync",
  "dep:generic-array",
  "dep:lokey-ble",
  "dep:nrf-sdc",
  "dep:trouble-host",
]

#! #### Microcontrollers

## Enables support for the nRF52840 microcontroller.
nrf52840 = [
  "dep:nrf-mpsl",
  "embassy-nrf/nrf52840",
  "nrf-mpsl?/nrf52840",
  "nrf-sdc?/nrf52840",
]
embassy-sync = ["dep:embassy-sync"]
generic-array = ["dep:generic-array"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
document-features = "0.2.11"
ekv = { version = "1.0.0", features = ["page-size-4096", "align-4"] }
embassy-executor = "0.10.0"
embassy-nrf = { version = "0.11.0", features = ["gpiote", "time-driver-rtc1", "nfc-pins-as-gpio"] }
embassy-sync = { version = "0.8.0", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
generic-array = { version = "1.4.5", optional = true }
lokey = { path = "../lokey" }
lokey-ble = { path = "../lokey-ble", optional = true }
lokey-usb = { path = "../lokey-usb", optional = true }
nrf-mpsl = { version = "0.4.0", features = ["critical-section-impl"], optional = true }
nrf-sdc = { version = "0.4.0", features = ["central", "peripheral"], optional = true }
static_cell = "2.1.0"
trouble-host = { version = "0.8.0", features = ["security"], optional = true }
typenum = "1.19.0"

[package.metadata.docs.rs]
features = ["defmt", "usb", "ble", "nrf52840"]
