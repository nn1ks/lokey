[package]
name = "lokey"
version = "0.0.1"
edition = "2024"
authors = ["Niklas Sauter <niklas@n1ks.net>"]
repository = "https://github.com/nn1ks/lokey"
license = "Apache-2.0 OR MIT"
description = "A firmware framework for input devices"
readme = "../../README.md"
categories = ["embedded", "no-std"]
keywords = ["keyboard", "firmware"]

[features]
default = ["macros"]

## Enables macros.
macros = [
  "dep:lokey_macros",
]

## Enables logging via [defmt](https://docs.rs/defmt/latest/defmt).
defmt = [
  "dep:defmt",
  # "ekv/defmt", # FIXME: The defmt feature of ekv conflicts with the std feature that is enabled in dev-dependencies
  "embassy-executor/defmt",
  "embassy-futures/defmt",
  "embassy-sync/defmt",
]


max-internal-message-size-8 = []
max-internal-message-size-16 = []
max-internal-message-size-32 = []
max-internal-message-size-64 = []
max-internal-message-size-128 = []
max-internal-message-size-256 = []
max-internal-message-size-512 = []
max-internal-message-size-1024 = []

internal-receiver-slots-8 = []
internal-receiver-slots-16 = []
internal-receiver-slots-24 = []
internal-receiver-slots-32 = []
internal-receiver-slots-40 = []
internal-receiver-slots-48 = []
internal-receiver-slots-56 = []
internal-receiver-slots-64 = []

external-receiver-slots-8 = []
external-receiver-slots-16 = []
external-receiver-slots-24 = []
external-receiver-slots-32 = []
external-receiver-slots-40 = []
external-receiver-slots-48 = []
external-receiver-slots-56 = []
external-receiver-slots-64 = []

external-observer-slots-8 = []
external-observer-slots-16 = []
external-observer-slots-24 = []
external-observer-slots-32 = []
external-observer-slots-40 = []
external-observer-slots-48 = []
external-observer-slots-56 = []
external-observer-slots-64 = []


[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
defmt = { version = "1.2.0", optional = true }
derive_more = { version = "2.0.1", default-features = false, features = ["display", "error", "from"] }
document-features = "0.2.11"
ekv = { version = "1.0.0", features = ["crc"] }
embassy-futures = "0.1.1"
embassy-sync = "0.8.0"
embassy-sync-0-6 = { package = "embassy-sync", version = "0.6.2" } # Required for ekv
embedded-storage-async = "0.4.2"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await-macro"] }
generic-array = "1.4.5"
lokey_macros = { path = "../lokey-macros", version = "0.0.1", optional = true }
portable-atomic = { version = "1.15.0", default-features = false, features = ["critical-section", "require-cas"] }
postcard = { version = "1.1.3", features = ["experimental-derive"], default-features = false }
seq-macro = "0.3.6"
serde = { version = "1.0.228", features = ["derive"], default-features = false }
static_cell = "2.1.0"
typeid = "1.0.3"
typenum = "1.20.1"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
defmt = { version = "1.2.0", features = ["unstable-test"] }
ekv = { version = "1.0.0", features = ["crc", "std"] }
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-64"] }

[package.metadata.docs.rs]
features = ["macros", "defmt"]
