# Build the Lokey Editor web app and deploy it to Cloudflare

name: Deploy Lokey Editor

on:
  push:
    branches: [ "master" ]
    paths:
      - editor/**
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./editor/lokey-editor
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install odyn dependencies
        working-directory: ./editor/lokey-editor-odyn
        run: npm install
      - name: Install core dependencies
        working-directory: ./editor/lokey-editor-core
        run: npm install
      - name: Build
        run: npm install && npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: editor/lokey-editor
          command: pages deploy dist/ --project-name=lokey-editor
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
