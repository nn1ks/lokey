# Build the Lokey Editor web app and deploy it to Cloudflare

name: Deploy Lokey Editor

on:
  push:
    branches: [ "master" ]
    paths:
      - editor/**
      - .github/workflows/deploy-lokey-editor.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./editor
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: editor/lokey-editor
          packageManager: pnpm
          command: pages deploy dist/ --project-name=lokey-editor
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
